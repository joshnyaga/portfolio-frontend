name: Deploy Portfolio

on:
  push:
    branches: [main] # or "master" or your deploy branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Copy project files to server
        run: |
          rsync -avz --exclude=node_modules --exclude=.next ./ \
            ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/portfolio/frontend

      - name: Build and run Docker container on server
        run: |
          ssh ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << EOF
            export NEXT_PUBLIC_API_URL="${{ secrets.NEXT_PUBLIC_API_URL }}"
            export NEXT_PUBLIC_IMAGE_URL="${{ secrets.NEXT_PUBLIC_IMAGE_URL }}"

            cd ${{ secrets.DEPLOY_PATH }}/portfolio/frontend

            docker build -t portfolio-frontend .

            docker stop portfolio-frontend || true
            docker rm portfolio-frontend || true

            docker run -d \
              --name portfolio-frontend \
              -p 3001:3001 \
              -e NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL \
              -e NEXT_PUBLIC_IMAGE_URL=$NEXT_PUBLIC_IMAGE_URL \
              portfolio-frontend
          EOF